name: Deploy original website design to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vue app
        run: npm run build

      - name: Prepare original website with navbar editor
        run: node scripts/prepare-site.js

      - name: Configure contact form recipient
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = 'dist/index.html'
          let html = await readFile(path, 'utf8')
          html = html.replace('const RECIPIENT_EMAIL = "mohammadfarooq127@gmail.com";', 'const RECIPIENT_EMAIL = "Mohammadfarooq.works@gmail.com";')
          if (!html.includes('const RECIPIENT_EMAIL = "Mohammadfarooq.works@gmail.com";')) {
            throw new Error('Could not configure the contact form recipient.')
          }
          await writeFile(path, html)
          NODE

      - name: Configure EmailJS contact form
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = 'dist/index.html'
          let html = await readFile(path, 'utf8')
          const replacements = [
            ['const EMAILJS_ENABLED = false;', 'const EMAILJS_ENABLED = true;'],
            ['const EMAILJS_PUBLIC_KEY  = "YOUR_PUBLIC_KEY";', 'const EMAILJS_PUBLIC_KEY  = "VI5_KKwtjDlJWWXUB";'],
            ['const EMAILJS_SERVICE_ID  = "YOUR_SERVICE_ID";', 'const EMAILJS_SERVICE_ID  = "service_orool8d";'],
            ['const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";', 'const EMAILJS_TEMPLATE_ID = "template_ptmq4dw";'],
          ]
          for (const [placeholder, configured] of replacements) {
            if (!html.includes(placeholder) && !html.includes(configured)) {
              throw new Error(`Could not configure EmailJS value: ${placeholder}`)
            }
            html = html.replaceAll(placeholder, configured)
          }
          await writeFile(path, html)
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
